<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>たしざんゲーム 最終版</title>
<style>
body{font-family:sans-serif;background:#eef9ff;text-align:center;margin:0;padding:16px;overflow-x:hidden}
#medals{position:fixed;left:10px;top:10px;font-size:30px;z-index:10}
#animal{position:fixed;right:10px;bottom:10px;background:#fff;padding:10px;border-radius:18px;box-shadow:0 0 8px #999;width:220px}
#pet{font-size:64px}.petmsg{font-weight:bold}
.wrap{display:flex;justify-content:center;align-items:flex-start;gap:20px}
.circles{display:grid;grid-template-columns:repeat(5,58px);gap:6px}
.circle{width:52px;height:52px;border:3px solid #333;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.active{background:#ffe066}.num,.sign{font-size:56px;font-weight:bold}
.choice{font-size:42px;padding:10px 24px;margin:8px;border-radius:16px}
#msg{height:60px;font-size:32px;font-weight:bold}.bad{color:red}
.trophy{font-size:200px}#confetti{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div id="confetti"></div>
<div id="medals"></div>
<div id="animal"><div id="pet"></div><div id="petmsg" class="petmsg"></div></div>
<h1>たしざんゲーム</h1>
<div id="game"></div>
<script>
const pets=[['🐰','がんばって！'],['🐶','いいぞ！'],['🐱','いいちょうし！'],['🐼','ゆっくりでだいじょうぶ！'],['🐸','そのちょうし！'],['🐻','あとすこし！']];
let q=0,medals=0;
const qs=[];
for(let i=0;i<10;i++){let a,b;do{a=1+Math.floor(Math.random()*5);b=1+Math.floor(Math.random()*5);}while(a+b>10);qs.push({a,b});}
function drawMedals(){medalsDiv.textContent='🏅'.repeat(medals)}
function setPet(){const p=pets[q%pets.length];pet.textContent=p[0];petmsg.textContent=p[1];}
function confettiFx(){confetti.innerHTML='';const colors=['#f44','#4af','#fd4','#6c6','#f6c'];for(let i=0;i<180;i++){let d=document.createElement('div');let startX=Math.random()*100;let startY=-(Math.random()*300);d.style.cssText=`position:fixed;width:8px;height:12px;left:${startX}vw;top:${startY}px;background:${colors[Math.floor(Math.random()*colors.length)]};transition:4s linear`;confetti.appendChild(d);let drift=(Math.random()*700)-350;setTimeout(()=>{d.style.transform=`translate(${drift}px,120vh) rotate(${Math.random()*1440}deg)`;},10);}setTimeout(()=>confetti.innerHTML='',4100);}
function makeCircles(n,p,start){let h='<div class="circles">';for(let i=1;i<=10;i++)h+=`<div class="circle" id="${p}${i}" onclick="tap('${p}',${i},${n},${start})"></div>`;return h+'</div>';}
function tap(p,i,n,start){if(i>n)return;let e=document.getElementById(p+i);let s=e.dataset.s||0;if(s==0){e.dataset.s=1;e.classList.add('active');}else if(s==1){e.dataset.s=2;e.textContent=start+i-1;}}
function finish(){animal.style.display='none';confetti.innerHTML='';game.innerHTML=`${medals===10?'<div class="trophy">🏆</div><h2>ぜんもんせいかい！おめでとう！</h2>':''}<div style="font-size:70px">${'🏅'.repeat(medals)}</div><h2>めだるを ${medals}こ とれたよ！ よくがんばったね</h2><button class="choice" onclick="location.reload()">もういちど</button>`;}
function show(){if(q>=10){finish();return;}animal.style.display='block';setPet();let {a,b}=qs[q],ans=a+b;game.innerHTML=`<h2>${q+1}もんめ</h2><div class="wrap"><div>${makeCircles(a,'a',1)}<div class="num">${a}</div></div><div class="sign">＋</div><div>${makeCircles(b,'b',a+1)}<div class="num">${b}</div></div><div class="sign">＝？</div></div><div id="msg"></div><div id="choices"></div>`;let choices=[ans];while(choices.length<3){let x=1+Math.floor(Math.random()*10);if(!choices.includes(x))choices.push(x);}choices.sort(()=>Math.random()-0.5);document.getElementById('choices').innerHTML=choices.map(v=>`<button class="choice" onclick="check(${v},${ans})">${v}</button>`).join('');}
function check(v,ans){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const m=document.getElementById('msg');if(v===ans){medals++;drawMedals();m.textContent='せいかい！';confettiFx();setTimeout(()=>{confetti.innerHTML='';q++;show();},3000);}else{m.className='bad';m.textContent='ざんねん！ こたえは '+ans+' だよ';setTimeout(()=>{q++;show();},2500);}}
const medalsDiv=document.getElementById('medals');drawMedals();show();
</script>
<script src="../../portal-nav.js"></script>
</body></html>
