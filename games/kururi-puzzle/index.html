<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101c2e"><title>くるりパズル</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23eaff53' d='M2 2h28v9H11v19H2z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand"><span class="mark">◩</span><h1>くるりパズル</h1></div><label class="pattern-label">パターン <select id="pattern"><option value="yellow">イエロー 8×5</option><option value="blue">ブルー 6×10</option></select></label><div class="progress"><span id="count">0</span><span> / <span id="total">10</span> ピース</span></div><button id="reset" aria-label="最初からやり直す">やり直す</button></header><div class="instructions"><span>☝ ドラッグで移動</span><span>↔ タップで裏返す</span><span>↻ ピース横のボタンで回転</span></div><section class="play" aria-label="パズルの操作エリア"><svg id="game" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="ピースで長方形を埋めるパズル"></svg><button id="piece-rotate" hidden aria-label="選んだピースを90度回転"><span aria-hidden="true">↻</span></button><div id="win" hidden><span>できました！</span><p><span id="win-total">10</span>個のピースが、ぴったり。</p><button id="again">もう一度遊ぶ</button></div></section><footer><button id="undo" disabled>↶ 1手戻す</button><span id="hint" role="status" aria-live="polite">ピースを枠に運んでみましょう</span><div class="actions"><button id="flip" disabled aria-label="選択したピースを裏返す">↔ 裏返す</button><button id="rotate" disabled aria-label="選択したピースを90度回転">↻ 回転</button></div></footer></main><dialog id="reset-dialog"><h2>最初から遊びますか？</h2><p>今の配置をリセットします。</p><div><button id="cancel-reset">続ける</button><button id="confirm-reset">やり直す</button></div></dialog><script src="app.js"></script></body></html>
