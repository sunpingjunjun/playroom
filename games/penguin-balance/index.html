<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ぺんぎんの てんびん</title><meta name="description" content="ぺんぎんをお皿に運んで、数と足し算で遊ぼう。"><link rel="icon" href="penguin.png"><link rel="stylesheet" href="style.css"></head><body>
<main>
<section id="home" class="home"><img class="welcome-duck" src="penguin.png" alt=""><h1>ぺんぎんの てんびん</h1><h2>どっちで あそぶ？</h2><div class="modes"><button id="free">じゆうに あそぶ</button><button id="quiz">もんだい</button></div><div class="settings"><label>かず <select id="limit"><option value="5">5まで</option><option value="10">10まで</option></select></label><button id="effects" aria-pressed="true">おと オン</button><button id="voice" aria-pressed="false">こえ オフ</button></div></section>
<section id="game" hidden><header><button id="back" aria-label="あそびかたを えらぶ">← もどる</button><h2 id="prompt" tabindex="-1"></h2><button id="reset">やりなおす</button></header><div id="stage" class="stage" aria-label="てんびん"><div class="stand" aria-hidden="true"></div><div class="foot" aria-hidden="true"></div><div id="beam" class="beam" aria-hidden="true"></div><img class="mascot" id="mascot" src="penguin.png" alt=""><div id="left" class="pan" role="button" tabindex="0" aria-label="ひだりの おさら"><div id="leftPieces" class="pieces"></div></div><div id="right" class="pan" role="button" tabindex="0" aria-label="みぎの おさら"><div id="rightPieces" class="pieces"></div></div></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><section id="tray" class="tray" aria-label="パーツのおうち"><div id="numbers" class="numbers"></div><span id="hint">つかんで おさらに のせよう</span></section><footer><button id="undo" aria-label="ひとつ もどす">↶ もどす</button><button id="next" hidden>つぎへ →</button></footer></section>
</main><script src="app.js?v=expressions-1"></script><script src="webmcp.js"></script><script src="../../portal-nav.js"></script></body></html>
