<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f4ea"><title>かな なぞりがき</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div><span class="eyebrow">ひらがな・カタカナ</span><h1>かな なぞりがき</h1></div><button id="back" class="quiet" hidden>もじを えらぶ</button></header>
<section id="picker"><p class="intro">れんしゅうする もじを えらんでね</p><div class="tabs"><button class="tab active" data-mode="hira">ひらがな</button><button class="tab" data-mode="kata">カタカナ</button><button id="undo" class="quiet" hidden>元に戻す</button><button id="clearAll" class="quiet" hidden>すべてのOKをクリア</button></div><div id="grid" class="grid"></div></section>
<section id="practice" hidden><div class="practice-head"><div><span id="phase" class="eyebrow"></span><h2 id="prompt"></h2></div><div id="count" class="count"></div></div><div class="board"><canvas id="guide" width="600" height="600" aria-label="なぞりがきの おてほん"></canvas><canvas id="ink" width="600" height="600" aria-label="ここを なぞって かいてね"></canvas></div><div id="confetti" aria-hidden="true"></div><p id="message" role="status">うすい せんを なぞってね</p><div class="actions"><button id="reset" class="quiet">この もじを やりなおす</button><button id="next" hidden>つぎへ</button></div><div id="progress" class="progress"></div></section></main><script src="stroke-data.js"></script><script src="app.js"></script><script src="../../portal-nav.js"></script></body></html>
