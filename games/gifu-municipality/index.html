function xy(p){return [(p[0]*.82-minX)*scale+ox,(-p[1]-minY)*scale+oy]}
function path(f){let polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;return polys.map(poly=>poly.map(r=>r.map((p,i)=>{let q=xy(p);return(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('')+'Z').join('')).join('')}
function center(f){let poly=f.geometry.type==='Polygon'?f.geometry.coordinates[0]:f.geometry.coordinates.sort((a,b)=>b[0].length-a[0].length)[0][0];let x=0,y=0;for(let p of poly){let q=xy(p);x+=q[0];y+=q[1]}return[x/poly.length,y/poly.length]}
function draw(){svg.innerHTML='';features.forEach((f,i)=>{let p=document.createElementNS(ns,'path');p.setAttribute('d',path(f));p.setAttribute('class','target'+(done.has(i)?' done':''));p.setAttribute('data-i',i);p.addEventListener('click',()=>place(i,p));svg.appendChild(p);if(showLabels||done.has(i)){let t=document.createElementNS(ns,'text'),c=center(f);t.setAttribute('x',c[0]);t.setAttribute('y',c[1]);t.setAttribute('text-anchor','middle');t.setAttribute('class','label');t.textContent=f.properties.N03_004;svg.appendChild(t)}})}
function renderTray(){tray.innerHTML='';features.map((f,i)=>({name:f.properties.N03_004,i})).sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(o=>{let b=document.createElement('button');b.className='piece'+(selected===o.i?' selected':'')+(done.has(o.i)?' done':'');b.textContent=o.name;b.onclick=()=>{selected=o.i;renderTray();message.textContent=o.name+' の場所をクリックしてください。'};tray.appendChild(b)});score.textContent=done.size+' / '+features.length}
function place(i,p){if(done.has(i))return;if(selected===null){message.textContent='まず市町村名を選んでください。';return}if(i===selected){done.add(i);selected=null;draw();renderTray();message.textContent=done.size===features.length?'完成！岐阜県の42市町村を制覇しました。':'正解！ 次のピースを選びましょう。'}else{p.classList.add('wrong');message.textContent='そこではありません。もう一度どうぞ。';setTimeout(()=>p.classList.remove('wrong'),500)}}
document.getElementById('hint').onclick=()=>{if(selected===null){message.textContent='ヒントを見たい市町村名を選んでください。';return}let p=svg.querySelector('[data-i="'+selected+'"]');p.classList.add('hint');setTimeout(()=>p.classList.remove('hint'),1400)};
document.getElementById('labels').onclick=e=>{showLabels=!showLabels;e.target.textContent=showLabels?'地名を隠す':'地名を表示';draw()};
document.getElementById('reset').onclick=()=>{done.clear();selected=null;showLabels=false;document.getElementById('labels').textContent='地名を表示';draw();renderTray();message.textContent='最初から挑戦しましょう。'};
draw();renderTray();
</script><script src="../../portal-nav.js"></script></body></html>
