<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>麺打ちビート！</title>
  <style>
    :root{--ink:#2b150c;--red:#d73827;--gold:#f5b93c;--paper:#fff8e5}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:radial-gradient(circle at 50% 0,#fff8d5 0 18%,#f5bc3f 18.2% 21%,#dd482c 21.2% 24%,#fff2d7 24.2% 100%)}.game{width:min(790px,100%)}h1{text-align:center;margin:0;font-size:clamp(30px,5vw,47px);letter-spacing:.08em;text-shadow:2px 2px #fff}.sub{text-align:center;margin:3px 0 12px;font-size:13px;font-weight:900}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}.stat{padding:6px;border:3px solid var(--ink);border-radius:10px;background:#fffdf2;text-align:center;font-weight:1000;box-shadow:2px 2px var(--ink)}.stat small{display:block;font-size:9px;letter-spacing:.12em}.stage{height:510px;position:relative;overflow:hidden;border:5px solid var(--ink);border-radius:21px;background:linear-gradient(#d9402b 0 68px,#fff5dc 68px 75%,#efa93a 75%);box-shadow:7px 8px rgba(43,21,12,.42)}.shop{height:68px;text-align:center;padding-top:8px;color:#fff8d7;font-size:17px;letter-spacing:.15em;font-weight:1000}.shop span{display:block;font-size:22px;line-height:22px;letter-spacing:.4em}.legend,.lanes{position:absolute;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.legend{top:74px;z-index:5;text-align:center;font-size:11px;font-weight:1000}.legend span{margin:0 3px;padding:3px 0;border:2px solid var(--ink);border-radius:7px;background:#fffdf2}.lanes{top:90px;bottom:0;border-left:2px solid rgba(43,21,12,.45);border-right:2px solid rgba(43,21,12,.45);background:repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 28px,rgba(105,43,18,.05) 29px 31px)}.lane{position:relative;border-right:2px solid rgba(43,21,12,.35)}.lane:last-child{border:0}.target{position:absolute;bottom:16px;left:2px;right:2px;height:72px;display:grid;place-items:center;border:3px solid var(--red);box-shadow:inset 0 0 0 3px #fff;background:rgba(255,249,222,.86);font-size:27px;font-weight:1000}.target i{position:absolute;bottom:4px;color:var(--red);font-size:11px;font-style:normal}.note{position:absolute;left:50%;width:78px;height:78px;display:grid;place-items:center;transform:translate(-50%,-50%);border:4px solid var(--ink);border-radius:50%;font-size:48px;box-shadow:3px 4px rgba(43,21,12,.27);z-index:4;user-select:none}.ramen{background:#fff0ba}.spicy{background:#ffd779}.pot{background:#dce9ed}.cup{background:#d6f1f7}.judge{position:absolute;left:50%;bottom:112px;z-index:10;transform:translateX(-50%) scale(.4);opacity:0;white-space:nowrap;font-size:37px;font-weight:1000;pointer-events:none}.judge.show{animation:judge .48s ease-out}@keyframes judge{15%{transform:translateX(-50%) scale(1.1);opacity:1}100%{transform:translateX(-50%) translateY(-30px);opacity:0}}.screen{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:rgba(255,248,226,.96)}.hidden{display:none!important}.panel{width:min(610px,100%);padding:20px;border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:7px 7px var(--ink);text-align:center}.panel h2{margin:0 0 6px;font-size:29px}.panel p{margin:5px 0 13px;font-size:13px;font-weight:800;line-height:1.5}.songs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;text-align:left}.song{padding:11px;border:3px solid var(--ink);border-radius:12px;background:#fff6d7;color:var(--ink;font:inherit);font:inherit;font-weight:900;cursor:pointer;box-shadow:2px 3px var(--ink)}.song:hover,.song:focus{outline:none;background:var(--gold);transform:translateY(-1px)}.song b{display:block;font-size:17px}.song small{display:block;margin-top:3px;font-size:11px}.song em{display:block;margin-top:5px;color:var(--red);font-size:12px;font-style:normal}.mobile{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}.mobile button{padding:11px 0;border:3px solid var(--ink);border-radius:10px;background:#fff8de;font:1000 18px inherit;box-shadow:0 3px var(--ink);touch-action:manipulation}.mobile button.active{transform:translateY(3px);box-shadow:none;background:var(--gold)}.hint{text-align:center;margin:12px 0 0;font-size:13px;font-weight:900}.hint b{color:var(--red)}@media(max-width:560px){.stage{height:480px}.note{width:62px;height:62px;font-size:39px}.legend{font-size:9px}.stat{font-size:13px}.songs{grid-template-columns:1fr}.panel{max-height:440px;overflow:auto}.mobile{display:grid}.hint{font-size:11px}}
    .song{color:var(--ink)}
    .target{cursor:pointer;touch-action:manipulation}
    .note{cursor:pointer;touch-action:manipulation}
    .stage,.lane{touch-action:manipulation}
    .mobile{display:none!important}
  </style>
</head>
<body>
<main class="game">
  <h1>麺打ちビート！</h1><p class="sub" id="songName">ゆったり判定で、湯気亭の看板店員を目指そう！</p>
  <section class="hud"><div class="stat"><small>SCORE</small><span id="score">000000</span></div><div class="stat"><small>COMBO</small><span id="combo">0</span></div><div class="stat"><small>MAX COMBO</small><span id="max">0</span></div><div class="stat"><small>TIME</small><span id="time">--</span></div></section>
  <section class="stage"><div class="shop">中華食堂・湯気亭<span>🏮　🏮　🏮</span></div><div class="legend"><span>D　🍜受取</span><span>F　🌶️受取</span><span>J　🍲弾く</span><span>K　🥛弾く</span></div><div class="lanes"><div class="lane"><div class="target" data-lane="0">D<i>受け取れ！</i></div></div><div class="lane"><div class="target" data-lane="1">F<i>受け取れ！</i></div></div><div class="lane"><div class="target" data-lane="2">J<i>弾け！</i></div></div><div class="lane"><div class="target" data-lane="3">K<i>弾け！</i></div></div></div><div class="judge" id="judge"></div><div class="screen" id="screen"></div></section>
  <p class="hint"><b>流れてくるノーツを、ラインに重なった瞬間に直接タップ！</b></p>
</main>
<script>
(()=>{
  const $=s=>document.querySelector(s),lanes=[...document.querySelectorAll('.lane')],screen=$('#screen'),judge=$('#judge'),scoreEl=$('#score'),comboEl=$('#combo'),maxEl=$('#max'),timeEl=$('#time'),songName=$('#songName');
  const keys={d:0,f:1,j:2,k:3}, kinds=[['🍜','ramen'],['🌶️🍜','spicy'],['🍲','pot'],['🥛','cup']];
  const songs=[
    {name:'湯気亭ビート',level:'★★☆☆　ゆったり',bpm:130,mode:'gradual',melody:[659,784,880,784,659,587,523,587]},
    {name:'開店準備マーチ',level:'★☆☆☆　かんたん',bpm:105,steps:[0,2,4,6],melody:[523,587,659,587,523,587,440,523]},
    {name:'鉄鍋ファンク',level:'★★★☆　むずかしい',bpm:140,steps:[0,1,2,4,5,6],melody:[440,523,659,587,523,659,784,659]},
    {name:'替え玉エクスプレス',level:'★★★★　超むずかしい',bpm:154,steps:[0,1,2,3,4,5,6,7],melody:[784,880,1047,880,784,659,587,659]}
  ];
  let ctx,playing=false,selected,beat,lead=1.9,duration=40,startAt=0,nextSound=0,chart=[],raf,score=0,combo=0,maxCombo=0,lastSecond=-1;
  function menu(){screen.classList.remove('hidden');screen.innerHTML='<div class="panel"><h2>🍜 本日のBGMを選択</h2><p>タップでもD・F・J・Kのレーンを操作できます。<br>湯気亭ビートは、さっきの130 BPM版です。</p><div class="songs">'+songs.map((s,i)=>'<button class="song" data-song="'+i+'"><b>'+s.name+'</b><small>'+s.bpm+' BPM</small><em>'+s.level+'</em></button>').join('')+'</div></div>';screen.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>begin(Number(b.dataset.song)))}
  function audio(){ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();return ctx}
  function tone(freq,when,len,type='triangle',vol=.03){let c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.001,when+len);o.connect(g).connect(c.destination);o.start(when);o.stop(when+len)}
  function makeChart(){chart=[];const lanePatterns=[[0,2,1,3,1,2,0,3],[0,1,3,2,1,0,2,3],[3,2,0,1,2,3,1,0],[0,3,2,1,0,2,3,1]],bars=Math.floor((duration-lead)/(4*beat));for(let bar=0;bar<bars;bar++){let rhythm=selected.mode==='gradual'?(bar<8?[0,2,4,6]:bar<15?[0,2,4,5,6]:[0,1,2,4,5,6,7]):selected.steps,lanesForBar=lanePatterns[bar%lanePatterns.length];rhythm.forEach((step,index)=>chart.push({time:lead+bar*4*beat+step*beat/2,lane:lanesForBar[(step+index)%8],hit:false,miss:false,el:null}))}}
  function scheduleMusic(){let elapsed=audio().currentTime-startAt;while(nextSound<elapsed+.16){let slot=Math.round(nextSound/(beat/2)),note=selected.melody[slot%selected.melody.length];tone(note,startAt+nextSound,.13,'triangle',.024);if(slot%2===0)tone([131,147,165,147][Math.floor(slot/8)%4],startAt+nextSound,.16,'sine',.028);if(slot%2)tone(170,startAt+nextSound,.02,'square',.008);nextSound+=beat/2}}
  function update(){scoreEl.textContent=String(score).padStart(6,'0');comboEl.textContent=combo;maxEl.textContent=maxCombo}
  function flash(text,good=true){judge.textContent=text;judge.style.color=good?'#d73827':'#47545b';judge.classList.remove('show');void judge.offsetWidth;judge.classList.add('show')}
  function tapLane(lane,showEarly=false){if(!playing)return;let now=audio().currentTime-startAt,n=chart.filter(x=>x.lane===lane&&!x.hit&&!x.miss).sort((a,b)=>Math.abs(a.time-now)-Math.abs(b.time-now))[0];if(n&&Math.abs(now-n.time)<=.23)hit(lane);else if(showEarly)flash('まだ！',false)}
  function showNote(n){let el=document.createElement('div'),kind=kinds[n.lane];el.className='note '+kind[1];el.textContent=kind[0];el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tapLane(n.lane,true)});lanes[n.lane].append(el);n.el=el}
  function hit(lane){if(!playing)return;document.querySelectorAll('[data-lane="'+lane+'"]').forEach(b=>{b.classList.add('active');setTimeout(()=>b.classList.remove('active'),75)});let now=audio().currentTime-startAt,n=chart.filter(x=>x.lane===lane&&!x.hit&&!x.miss).sort((a,b)=>Math.abs(a.time-now)-Math.abs(b.time-now))[0];if(!n||Math.abs(now-n.time)>.23){combo=0;flash('空振り',false);tone(130,audio().currentTime,.08,'sawtooth',.045);update();return}let perfect=Math.abs(now-n.time)<.09;n.hit=true;n.el?.remove();score+=(perfect?1000:600)+combo*(perfect?10:7);combo++;maxCombo=Math.max(maxCombo,combo);flash(perfect?'PERFECT!':'GREAT!');tone(perfect?1047:784,audio().currentTime,.09,'sine',.055);update()}
  function frame(){if(!playing)return;let now=audio().currentTime-startAt;scheduleMusic();chart.forEach(n=>{let distance=n.time-now;if(!n.el&&!n.hit&&!n.miss&&distance<lead)showNote(n);if(n.el)n.el.style.top=((1-distance/lead)*(lanes[0].clientHeight-50))+'px';if(!n.hit&&!n.miss&&now-n.time>.25){n.miss=true;n.el?.remove();combo=0;flash('MISS',false);update()}});let remaining=Math.max(0,Math.ceil(duration-now));if(remaining!==lastSecond){lastSecond=remaining;timeEl.textContent=remaining}if(now>=duration)finish();else raf=requestAnimationFrame(frame)}
  function begin(index){selected=songs[index];beat=60/selected.bpm;audio();score=combo=maxCombo=0;lastSecond=-1;nextSound=0;makeChart();update();songName.textContent=selected.name+'　'+selected.bpm+' BPM';screen.classList.add('hidden');playing=true;startAt=audio().currentTime+.3;raf=requestAnimationFrame(frame)}
  function finish(){playing=false;cancelAnimationFrame(raf);chart.forEach(n=>n.el?.remove());screen.innerHTML='<div class="panel"><h2>閉店！ おつかれさま</h2><p>'+selected.name+'<br>最終スコア<br><strong style="font-size:42px;color:#d73827">'+String(score).padStart(6,'0')+'</strong><br>MAX COMBO '+maxCombo+'</p><button class="song" id="back" style="text-align:center">曲をえらぶ</button></div>';screen.classList.remove('hidden');$('#back').onclick=menu}
  let lastTouch=0;$('.stage').addEventListener('touchend',e=>{let now=Date.now();if(now-lastTouch<320)e.preventDefault();lastTouch=now},{passive:false});addEventListener('keydown',e=>{let lane=keys[e.key.toLowerCase()];if(lane!==undefined&&!e.repeat){e.preventDefault();hit(lane)}});document.querySelectorAll('.target').forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tapLane(i)}));lanes.forEach((lane,i)=>lane.addEventListener('pointerdown',()=>tapLane(i)));menu();
})();
</script>
</body></html>
